name: Bug
description: Something in the portal or a tool does not work
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: did
    attributes:
      label: What you did
      description: Where you were, what you clicked or typed
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened instead
      description: If you can, open the browser console (Chrome: Ctrl+Shift+J, or ⌥⌘J on a Mac) and paste any red errors
    validations:
      required: true
